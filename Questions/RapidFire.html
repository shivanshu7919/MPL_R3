<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rapid Fire | MPL</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Syne:wght@800&family=Teko:wght@700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="track.css">
</head>

<body>
    <!-- Cosmic Background Layers -->
    <div class="bg-photo"></div>
    <div class="bg-tint"></div>
    <div class="aurora"><span class="a1"></span><span class="a2"></span></div>
    <canvas id="stars"></canvas>


    <!-- ================= NAVBAR ================= -->
    <nav class="track-navbar">

        <div class="track-logo">
            <img src="../assets/images/mpl-crest.png" alt="MPL Logo"
                onerror="this.onerror=null;this.src='../Logo.png';">
        </div>

        <div class="track-navigation">
            <button class="track-nav-button" id="homeButton">
                <span>Home</span>
            </button>
            <button class="track-nav-button" id="resetButton">
                <span>Reset</span>
            </button>
        </div>

    </nav>


    <!-- ================= TRACK HEADER ================= -->
    <header class="track-header">

        <h1 class="track-title">
            RAPID FIRE
        </h1>

        <div class="title-decoration"></div>

    </header>


    <!-- ================= QUESTIONS ================= -->
    <main class="question-grid">

        <!-- 100 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="What is the capital of India?" data-answer="New Delhi">

            <h2 class="question-name">
                QUESTION 1
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- 200 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="200"
            data-question="How many days are there in a leap year?" data-answer="366 days">

            <h2 class="question-name">
                QUESTION 2
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                200
            </p>

        </div>


        <!-- 300 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="300"
            data-question="Which planet is known as the Red Planet?" data-answer="Mars">

            <h2 class="question-name">
                QUESTION 3
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                300
            </p>

        </div>


        <!-- 400 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="400"
            data-question="Who wrote the national anthem of India?" data-answer="Rabindranath Tagore">

            <h2 class="question-name">
                QUESTION 4
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                400
            </p>

        </div>


        <!-- 500 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="500"
            data-question="What is the largest ocean on Earth?" data-answer="Pacific Ocean">

            <h2 class="question-name">
                QUESTION 5
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                500
            </p>

        </div>


        <!-- 600 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="600"
            data-question="Which is the only mammal capable of true flight?" data-answer="Bat">

            <h2 class="question-name">
                QUESTION 6
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                600
            </p>

        </div>

    </main>


    <!-- ================= QUESTION POPUP ================= -->
    <div class="question-popup" id="questionPopup">

        <div class="popup-content">

            <button class="close-popup" id="closePopup">
                ×
            </button>

            <!-- 30-SEC COUNTDOWN TIMER -->
            <div class="popup-timer" id="popupTimer">
                <span class="timer-icon">⏱</span>
                <span class="timer-val" id="timerCount">30</span>
                <span class="timer-sec">SEC</span>
            </div>


            <p class="popup-track" id="popupTrack">
                RAPID FIRE
            </p>

            <h2 class="popup-question" id="popupQuestion">
                Question
            </h2>

            <p class="popup-points">
                <span id="popupPoints">100</span> POINTS
            </p>

            <button class="answer-button" id="answerButton">
                SHOW ANSWER
            </button>

            <div class="popup-answer" id="popupAnswer">
                Answer
            </div>

        </div>


    </div>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="../assets/js/stars.js"></script>
    <script src="track.js"></script>

</body>

</html>
