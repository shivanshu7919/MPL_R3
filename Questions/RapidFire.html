<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rapid Fire | MPL</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Syne:wght@800&family=Teko:wght@700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="track.css">
</head>

<body>
    <!-- Cosmic Background Layers -->
    <div class="bg-photo"></div>
    <div class="bg-tint"></div>
    <div class="aurora"><span class="a1"></span><span class="a2"></span></div>
    <canvas id="stars"></canvas>


    <!-- ================= NAVBAR ================= -->
    <nav class="track-navbar">

        <div class="track-logo">
            <img src="../assets/images/mpl-crest.png" alt="MPL Logo"
                onerror="this.onerror=null;this.src='../Logo.png';">
        </div>

        <div class="track-navigation">
            <button class="track-nav-button" id="homeButton">
                <span>Home</span>
            </button>
            <button class="track-nav-button" id="resetButton">
                <span>Reset</span>
            </button>
        </div>

    </nav>


    <!-- ================= TRACK HEADER ================= -->
    <header class="track-header">

        <h1 class="track-title">
            RAPID FIRE
        </h1>

        <div class="title-decoration"></div>

    </header>


    <!-- ================= QUESTIONS ================= -->
    <main class="question-grid">

        <!-- QUESTION 1 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="How many total cards are in a standard, modern UNO deck?" data-answer="108">

            <h2 class="question-name">
                QUESTION 1
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 2 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="In standard target darts, what is the highest possible score you can achieve with a single throw?" data-answer="60">

            <h2 class="question-name">
                QUESTION 2
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 3 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="Exactly how many individual human beings have ever set foot on the surface of the Moon?" data-answer="12">

            <h2 class="question-name">
                QUESTION 3
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 4 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="Date of Haley Dunphy’s birthday?" data-answer="10">

            <h2 class="question-name">
                QUESTION 4
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 5 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="Runtime of Dhurandhar 2 in mins?" data-answer="235 mins">

            <h2 class="question-name">
                QUESTION 5
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 6 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="Kill count in Final Destination 3?" data-answer="29">

            <h2 class="question-name">
                QUESTION 6
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 7 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="How many Andy’s toys were there in Toys movie?" data-answer="23">

            <h2 class="question-name">
                QUESTION 7
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 8 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="How many MCU TV shows are there?" data-answer="17">

            <h2 class="question-name">
                QUESTION 8
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- QUESTION 9 -->
        <div class="question-card" data-track="RAPID FIRE" data-points="100"
            data-question="What's the population of Bikini Bottom in SpongeBob universe?" data-answer="538">

            <h2 class="question-name">
                QUESTION 9
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>

    </main>


    <!-- ================= QUESTION POPUP ================= -->
    <div class="question-popup" id="questionPopup">

        <div class="popup-content">

            <button class="close-popup" id="closePopup">
                ×
            </button>

            <!-- 20-SEC COUNTDOWN TIMER -->
            <div class="popup-timer" id="popupTimer">
                <span class="timer-icon">⏱</span>
                <span class="timer-val" id="timerCount">20</span>
                <span class="timer-sec">SEC</span>
            </div>


            <p class="popup-track" id="popupTrack">
                RAPID FIRE
            </p>

            <h2 class="popup-question" id="popupQuestion">
                Question
            </h2>

            <p class="popup-points">
                <span id="popupPoints">100</span> POINTS
            </p>

            <button class="answer-button" id="answerButton">
                SHOW ANSWER
            </button>

            <div class="popup-answer" id="popupAnswer">
                Answer
            </div>

        </div>


    </div>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="../assets/js/stars.js"></script>
    <script src="track.js"></script>

</body>

</html>
